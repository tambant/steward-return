<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Back to Steward</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 17px -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
  a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 28px; background: #1c6b5e; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <p>Bank approval finished.</p>
  <a id="back" href="steward://bank-callback">Back to Steward</a>
</main>
<script>
  // Passes the bank's one-time result to the app. Nothing is stored or sent anywhere else.
  var target = "steward://bank-callback" + window.location.search;
  document.getElementById("back").href = target;
  window.location.replace(target);
</script>
</body>
</html>
